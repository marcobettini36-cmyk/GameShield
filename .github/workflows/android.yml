name: Android APKs and tests
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ['Update gambling blacklist']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android tooling
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Test feed parser
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and verify both editions
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testNormalDebugUnitTest testStrongDebugUnitTest lintNormalDebug lintStrongDebug assembleNormalDebug assembleStrongDebug assembleNormalRelease assembleStrongRelease assembleNormalDebugAndroidTest assembleStrongDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: device-test-apks
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/apk/androidTest/*/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GameShield-Normal-debug
          path: app/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GameShield-Strong-debug
          path: app/build/outputs/apk/strong/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GameShield-release-unsigned
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            feeds/metadata.json
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        edition: [normal, strong]
        dns: [off, opportunistic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: device-test-apks
          path: device-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual VPN data path and failure policies
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_playstore
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/device_tests.py device-apks ${{ matrix.edition }} ${{ matrix.dns }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tunnel-device-reports-${{ matrix.edition }}-${{ matrix.dns }}
          path: device-reports/
