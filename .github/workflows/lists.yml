name: Update gambling blacklist
on:
  schedule:
    - cron: '21 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/update_lists.py
      - name: Publish validated snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds app/src/main/assets/gambling.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated gambling blacklist snapshots'
            git push
          fi
