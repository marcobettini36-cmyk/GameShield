name: Update gambling blacklist
on:
  schedule:
    - cron: '21 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/update_lists.py
      - name: Open reviewable blacklist update
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/blacklist
          title: Update gambling blacklist snapshots
          commit-message: Update gambling blacklist snapshots
          body: 'Daily list refresh. Inspect feeds/metadata.json for source counts, hashes and any unavailable ADM sources. Merge to publish the new feed and trigger APK builds.'
          add-paths: |
            feeds/
            app/src/main/assets/gambling.txt
